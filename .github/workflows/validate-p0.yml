name: Validate Zinbo P0
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify source integrity
        run: node scripts/build.mjs
      - name: Claude design token audit
        run: node scripts/design-audit.mjs
      - name: P0 text audit
        run: node scripts/p0-text-audit.mjs --strict
      - name: P0 regression checks
        run: node scripts/p0-regression.mjs
      - name: Install Chromium test driver (CI only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install chromium
      - name: Browser smoke test
        run: node scripts/p0-browser-smoke.mjs
      - name: Capture phase-0 before/after at three viewports
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/zinbo-phase0-baseline" origin/main
          (cd "$RUNNER_TEMP/zinbo-phase0-baseline" && node scripts/build.mjs)
          node scripts/phase0-screenshots.mjs "$RUNNER_TEMP/zinbo-phase0-baseline/public/index.html" public/index.html artifacts/phase-0
      - name: Publish phase-0 screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phase0-before-after-screenshots
          path: artifacts/phase-0
          if-no-files-found: warn
