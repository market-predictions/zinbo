name: Validate Zinbo P0
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build with pinned SHA-256
        run: node scripts/build.mjs
      - name: P0 text audit
        run: node scripts/p0-text-audit.mjs --strict
      - name: P0 regression checks
        run: node scripts/p0-regression.mjs
      - name: Install Chromium test driver (CI only)
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install chromium
      - name: Browser smoke test
        run: node scripts/p0-browser-smoke.mjs
